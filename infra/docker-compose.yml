# Local dependencies for development. Start with:
#   docker compose -f infra/docker-compose.yml up -d
# Host ports avoid the defaults (5432/6379) so other local projects can run alongside.
name: systemix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: systemix
      POSTGRES_PASSWORD: systemix
      POSTGRES_DB: systemix
    ports:
      - "${SYSTEMIX_POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemix -d systemix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${SYSTEMIX_REDIS_PORT:-6389}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
