name: API

on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: systemix
          POSTGRES_PASSWORD: systemix
          POSTGRES_DB: systemix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U systemix -d systemix"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://systemix:systemix@localhost:5432/systemix
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test (unit + integration)
        run: uv run pytest -m "integration or not integration"
